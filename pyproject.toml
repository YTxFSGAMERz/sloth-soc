[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sloth-soc"
version = "0.1.0"
description = "Offline lazy security analyst: server log summarizer with local LLMs and math-first detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Sloth SOC Team" }
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.13.0",
    "jinja2>=3.1.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
]
eval = [
    "matplotlib>=3.8.0",
]

[project.scripts]
sloth-soc = "sloth_soc.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
